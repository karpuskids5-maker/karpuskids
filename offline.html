<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karpus Kids · Sin conexión</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(120% 120% at 50% 0%, #1e293b 0%, #0f172a 60%);
    color: #e2e8f0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 420px; width: 100%; text-align: center;
    background: rgba(30, 41, 59, .72);
    border: 1px solid rgba(148, 163, 184, .18);
    border-radius: 24px; padding: 40px 32px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    backdrop-filter: blur(12px);
  }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px;
    background: linear-gradient(135deg, #f97316, #e11d48);
    display: grid; place-items: center; font-size: 30px;
  }
  h1 { margin: 0 0 8px; font-size: 1.35rem; font-weight: 800; letter-spacing: -.01em; }
  p  { margin: 0 0 22px; font-size: .9rem; line-height: 1.55; color: #94a3b8; }
  button {
    width: 100%; padding: 13px 20px; border: 0; border-radius: 14px;
    background: linear-gradient(135deg, #f97316, #e11d48);
    color: #fff; font-size: .82rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: .09em; cursor: pointer;
    transition: transform .16s ease, filter .16s ease;
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: scale(.97); }
  .hint { margin-top: 18px; font-size: .72rem; color: #64748b; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #ef4444; margin-right: 7px;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, .18);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🧸</div>
    <h1>Estás sin conexión</h1>
    <p><span class="dot"></span>No pudimos alcanzar el servidor de Karpus Kids. Los datos guardados localmente siguen disponibles, pero para sincronizar necesitas conexión.</p>
    <button onclick="location.reload()">Reintentar</button>
    <p class="hint">Los registros se guardan en cola y se sincronizan solos al volver a estar en línea.</p>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
